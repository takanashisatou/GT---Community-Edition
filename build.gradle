plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    alias libs.plugins.modDevGradle
    alias libs.plugins.spotless
}

group = maven_group

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Formats the mod version to include the loader, Minecraft version, and build number (if present)
boolean isSnapshot = System.getenv("SNAPSHOT")
version = "${mod_version}" + (isSnapshot ? "-SNAPSHOT" : "")

sourceSets {
    // Include resources generated by data generators.
    main.resources {
        srcDir 'src/generated/resources'
    }

    test {
        kotlin {
            srcDirs += 'src/test/java'
        }
        compileClasspath += main.output
        runtimeClasspath += main.output
    }

    extra {
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

// Cache changing modules for 5 minutes
configurations.all {
    resolutionStrategy.cacheChangingModulesFor 5, 'minutes'
}

// Set up the test and extra configurations
configurations {
    testImplementation.extendsFrom(implementation)
    testRuntimeOnly.extendsFrom(runtimeOnly)
    extraImplementation.extendsFrom(implementation)
    extraRuntimeOnly.extendsFrom(runtimeOnly).transitive(false)
    extraRuntimeClasspath.transitive(false)

    // Dev-run-only runtime dependencies (named/remapped, never published).
    // Mirrors gtm-reborn/gtecore: every run source set sees these.
    localRuntime
    runtimeClasspath.extendsFrom(localRuntime)
    extraRuntimeClasspath.extendsFrom(localRuntime)
    testRuntimeClasspath.extendsFrom(localRuntime)
}

obfuscation {
    createRemappingConfiguration(configurations.extraRuntimeOnly)
    createRemappingConfiguration(configurations.localRuntime)
}

// jars.gradle must be applied BEFORE moddevgradle.gradle. Its `obfuscation {
// reobfuscate(slimJar, sourceSets.main) }` call registers a reobfuscated artifact
// for the main source set, and ModDevGradle keeps one such artifact per source set
// in the reobfApiElements / reobfRuntimeElements configurations that back
// components.java. Applied after legacyForge {}, the slim jar displaced the main
// reobfJar there, so the published Gradle Module Metadata advertised the slim jar
// as the module's primary artifact -- consumers resolving dev.arbor:gt---1.20.1
// silently received a jar with no bundled dependencies. This is the same order
// gtecore and gtm-reborn use.
apply from: "$projectDir/gradle/scripts/jars.gradle"
apply from: "$projectDir/gradle/scripts/moddevgradle.gradle"
apply from: "$rootDir/gradle/scripts/repositories.gradle"
apply from: "$projectDir/dependencies.gradle"
apply from: "$projectDir/gradle/scripts/resources.gradle"
apply from: "$projectDir/gradle/scripts/publishing.gradle"
//apply from: "$rootDir/gradle/scripts/spotless.gradle"

// Create run-folders for non-client configs to avoid pollution of dev envs
generateModMetadata.doFirst {
    mkdir('run/server')
    mkdir('run/gametest')
    mkdir('run/data')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        freeCompilerArgs.add("-Xjvm-default=all")
    }
}
