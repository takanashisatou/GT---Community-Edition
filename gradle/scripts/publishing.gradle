// ============================================================================
// publishing.gradle — Maven publication for GT-- (gtnn)
// ============================================================================
// Mirrors the gtecore/gtm-reborn setup so `:modules:gt--:publish` produces the
// same artifact layout: the main reobfuscated jar as the module's primary
// artifact, plus the slim jar as a classified extra.
//
// This used to attach reobfJar explicitly and leave the slim jar to
// components.java, because jars.gradle was applied AFTER moddevgradle.gradle and
// ModDevGradle had therefore folded the *slim* jar into components.java. That
// produced Gradle Module Metadata whose reobfApiElements / reobfRuntimeElements
// variants both advertised gt---<ver>-slim.jar, so anyone resolving
// dev.arbor:gt---1.20.1 through Gradle silently received a jar with no bundled
// dependencies -- exactly the jar the release notes warn players not to put in
// mods/. The POM carries `published-with-gradle-metadata`, so Gradle consumers
// always preferred that metadata over the plain coordinate.
//
// jars.gradle is now applied before moddevgradle.gradle, so components.java
// carries the main jar and the slim jar is the one that needs attaching --
// the same shape as the other two modules.
//
// GT--'s `sourcesJar` has no `from` clause and the module does not call
// `java.withSourcesJar()`, so there is no sources artifact to publish here.

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            if (tasks.findByName("reobfSlimJar")) {
                artifact(tasks.named("reobfSlimJar"))
            }
            from components.java
        }
    }

    repositories {
        maven {
            name = "LocalMaven"
            url = uri(project.findProperty("mavenDir") ?: "${rootDir}/build/maven")
        }
    }
}
